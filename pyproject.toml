[project]
name = "smart-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rameen Hamid", email = "rameen.hamid@royalcyber.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "fastapi>=0.165.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-copilot = "smart_copilot:main"
check = "smart_copilot.check:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
infra = [
    "aws-cdk-lib>=2.278.0",
    "constructs>=10.8.1",
]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.pytest.ini_options]
pythonpath = ["infra"]
